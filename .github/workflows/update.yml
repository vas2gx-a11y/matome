name: まとめ更新

on:
  schedule:
    - cron: "7,27,47 * * * *"   # 20分ごと（毎時7・27・47分。混雑する0分ちょうどを避けています）
  workflow_dispatch:          # 手動実行ボタン
  push:
    paths: ["feeds.txt", "ng_words.txt", "build.py"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: 変更を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "update $(date +'%m/%d %H:%M')"
          # 同時に別の更新が入っていたら取り込んでから送る（最大3回）
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs || { git rebase --abort; exit 1; }
          done
